[project]
name = "sidequest-ai"
version = "0.1.0"
description = "A screen-minimal outdoor exploration game powered by local open-weight inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "transformers==4.57.1",
    "torch>=2.4",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "model: tests that require real open-weight model weights (deselected by default via -m 'not model')",
    "slow: long-running tests",
]