# Render blueprint for SideQuest AI.
#
# Set OPENROUTER_API_KEY in the Render dashboard to enable remote inference.
# Without it, the app uses its deterministic generator and labels results as
# unverified. Mission prompts and submitted photos are sent to OpenRouter.

services:
  - type: web
    name: sidequest-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Free tier sleeps after inactivity, so the first request after an idle
    # period pays a cold start. Set SYNC=false to accept unsaved instances.
    autoDeploy: true

    envVars:
      - key: PYTHONPATH
        value: /app/backend

      - key: SIDEQUEST_WEB_DIR
        value: /app/web

      - key: SIDEQUEST_DATA_DIR
        value: /app/data

      # Secret. Set in the Render dashboard; never committed.
      - key: GROQ_API_KEY
        sync: false

      # OpenRouter kept for fallback; Groq takes priority when GROQ_API_KEY present.
      - key: OPENROUTER_API_KEY
        sync: false

      # Model selection. Default to Groq open-weight model; can override with GROQ_MODEL.
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant

      # Preserve existing OpenRouter settings for fallback path.
      - key: OPENROUTER_MODEL_ID
        value: google/gemma-3-4b-it

      - key: SIDEQUEST_GEN_TIMEOUT
        value: "45"

      - key: SIDEQUEST_VERIFY_TIMEOUT
        value: "60"
